<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1324">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APBN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>APBN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: navy ledger app. Sidebar on desktop, bottom tabs on phone; summary first, detail below. Gold = savings accent. */
:root{
  --bg:#0a1324; --surface:#111d35; --surface-2:#172747; --line:#24375c;
  --ink:#e9eef8; --muted:#8e9cba; --gold:#d9b65c; --gold-ink:#1b1505;
  --income:#41c79b; --expense:#f27a6e; --warn:#f0b44c; --info:#6ea8ff;
  --font:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#edf1f8; --line:#dce3ef;
  --ink:#14203b; --muted:#5d6a84; --gold:#c48a16; --gold-ink:#1d1503;
  --income:#14966a; --expense:#d0493f; --warn:#c07a08; --info:#2d68d2;
  color-scheme:light;
}
:root[data-theme="light"] .banner{color:#7a5200}
:root[data-theme="light"] .card,:root[data-theme="light"] .side{box-shadow:0 1px 2px rgba(20,32,59,.05)}
/* theme switch */
.theme-sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:8px}
.ts-track{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.ts-knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s;display:grid;place-items:center;font-size:10px}
.theme-sw[aria-checked="true"] .ts-track{background:var(--gold)}
.theme-sw[aria-checked="true"] .ts-knob{left:19px}
.theme-mini{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px}
@media(min-width:900px){.theme-mini{display:none}}
/* slicers */
.slicers{display:flex;gap:8px}
.slc{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px 6px;min-width:96px}
.slc span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slc select{border:0;background:transparent;font-weight:800;font-size:15px;padding:0;cursor:pointer;color:var(--ink)}
.slc select:focus{outline:none}
.slc:focus-within{border-color:var(--gold)}
/* segmented mini toggle */
.mini-seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.mini-seg button{border:0;background:none;color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer}
.mini-seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
/* grouped plan table */
.gtable th.ghd{text-align:center;font-size:12px;letter-spacing:.04em;padding:10px 6px 6px;border-bottom:2px solid var(--line)}
.gtable th.ghd.g-in{color:var(--income);border-bottom-color:var(--income)}
.gtable th.ghd.g-out{color:var(--expense);border-bottom-color:var(--expense)}
.gtable th.ghd.g-sav{color:var(--gold);border-bottom-color:var(--gold)}
.gtable .gs{border-left:1px solid var(--line)}
.gtable td,.gtable th{padding:8px 8px;font-size:13px}
.gtable td:first-child,.gtable th:first-child,.cftable td:first-child,.cftable th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.cftable tr.own td:first-child{background:var(--surface-2)}
.gtable tr.cur td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.gtable tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.gtable tbody tr:hover td{background:var(--surface-2)}
.toggle-h{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink)}
.legend2{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.ln{height:3px;width:18px;border-radius:2px}
.sw.dash{height:0;width:18px;border-top:2.5px dashed var(--info);border-radius:0}
/* budget ring */
.ring-wrap{display:flex;align-items:center;gap:16px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ring-wrap b{font-size:15px}
/* cashflow */
.cf-grid{display:grid;grid-template-columns:1fr;gap:12px}
.cf-grid .wf{max-width:620px;width:100%;margin:0 auto}
.cftable td,.cftable th{padding:8px 9px;font-size:13px}
.cftable tr.own td{background:var(--surface-2);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cftable td.cl{font-weight:800}
.acc-chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.acc-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--surface-2);flex:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media(min-width:900px){.app{grid-template-columns:232px 1fr}}
.side{display:none}
@media(min-width:900px){.side{display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#a8822f);display:grid;place-items:center;color:var(--gold-ink);font-weight:800}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:600}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--surface-2);color:var(--gold)}
.side .spacer{flex:1}
.side .add-side{justify-content:center;background:var(--gold);color:var(--gold-ink)}
.side .add-side:hover{background:#e6c46d;color:var(--gold-ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;text-align:center}
@media(min-width:900px){.tabs{display:none}}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:18px;border:0;background:var(--gold);color:var(--gold-ink);box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer;z-index:21;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media(min-width:900px){.fab{display:none}}

main{padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 140px calc(16px + env(safe-area-inset-left));max-width:1120px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media(min-width:900px){main{padding:26px 32px 60px}}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.topbar h1{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.month button{border:0;background:none;width:38px;height:38px;cursor:pointer;color:var(--muted);font-size:18px}
.month button:hover{color:var(--ink)}
.month b{min-width:96px;text-align:center;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--income)} .dot.warn{background:var(--warn)} .dot.off{background:var(--expense)}
.banner{background:rgba(240,180,76,.12);border:1px solid rgba(240,180,76,.4);color:#f6d79a;padding:10px 14px;border-radius:12px;font-size:13px}

.grid{display:grid;gap:14px}
.grid>*{min-width:0}
main>*{min-width:0}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.04em}
.kpi .ico{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.kpi .ico svg{width:14px;height:14px}
.kpi .value{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.02em;overflow-wrap:anywhere}
@media(min-width:700px){.kpi .value{font-size:23px}}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.c-in{color:var(--income)} .c-out{color:var(--expense)} .c-gold{color:var(--gold)} .c-warn{color:var(--warn)} .c-muted{color:var(--muted)} .c-info{color:var(--info)}
.bg-in{background:rgba(65,199,155,.15);color:var(--income)}
.bg-out{background:rgba(242,122,110,.15);color:var(--expense)}
.bg-gold{background:rgba(217,182,92,.16);color:var(--gold)}
.bg-info{background:rgba(110,168,255,.15);color:var(--info)}
.two{grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1.35fr 1fr}}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:16px}
.card-h .meta{font-size:12px;color:var(--muted)}
.link{border:0;background:none;color:var(--gold);cursor:pointer;font-weight:600;font-size:13px;padding:0}

.flow{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.flow{grid-template-columns:1fr 1fr}}
.flow-btn{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.flow-btn:hover{border-color:var(--gold)}
.flow-btn .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.flow-btn b{display:block;font-size:15px}
.flow-btn span{font-size:12px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--income)}
.bar i.watch{background:var(--warn)} .bar i.over{background:var(--expense)} .bar i.gold{background:var(--gold)}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .amt{font-size:13px;text-align:right;color:var(--muted)}
.brow .amt b{color:var(--ink)}
.brow .bar{grid-column:1/-1}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:rgba(65,199,155,.15);color:var(--income)}
.pill.watch{background:rgba(240,180,76,.15);color:var(--warn)}
.pill.over{background:rgba(242,122,110,.16);color:var(--expense)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.pill.full{background:rgba(110,168,255,.14);color:var(--info)}
.bar i.full{background:var(--info)}
.pill.src{background:rgba(110,168,255,.14);color:var(--info)}
.pill.ret{background:rgba(65,199,155,.15);color:var(--income)}

.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.tx:hover{background:var(--surface-2)}
.tx:first-child{border-top:0}
.tx .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.tx .t1{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:700;text-align:right;white-space:nowrap}
.grp{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:14px 4px 4px;display:flex;justify-content:space-between}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.search{flex:1;min-width:160px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
.input,select.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
.input:focus{border-color:var(--gold);outline:none}
.amount-in{font-size:28px;font-weight:800;text-align:right;letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"][data-t="expense"]{color:var(--expense)}
.seg button[aria-pressed="true"][data-t="income"]{color:var(--income)}
.seg button[aria-pressed="true"][data-t="saving"]{color:var(--gold)}
.seg button[aria-pressed="true"][data-t="transfer"]{color:var(--info)}
.btn{border:1px solid var(--line);background:var(--surface-2);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:700;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{background:#e6c46d}
.btn.danger{color:var(--expense)}
.btn.danger.armed{background:var(--expense);color:#2a0a06;border-color:var(--expense)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input,.pre input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:480px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:88px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:center;font-size:12.5px;font-weight:600;line-height:1.25}
.tile:hover{border-color:var(--gold)}
.tile .em{font-size:24px;line-height:1}
.tile small{font-size:11px;color:var(--muted);font-weight:500}
.tile.item{min-height:64px;font-size:13.5px}
.tile.add{border-style:dashed;border-color:rgba(217,182,92,.55);color:var(--gold);background:rgba(217,182,92,.06)}
.tile.add .em{font-size:22px;font-weight:800}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.crumb button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:13px}
.crumb button:hover{border-color:var(--gold)}
.crumb .sep{color:var(--muted)}
.monthpick{display:flex;align-items:center;gap:8px}
.monthpick input{max-width:170px}

.modal{position:fixed;inset:0;background:rgba(3,7,16,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:760px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-size:18px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:18px;flex:none}

/* Pre-read tables */
.pre{width:100%;border-collapse:collapse}
.pre th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 6px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.pre th:nth-child(-n+2){text-align:left}
.pre td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px;vertical-align:middle}
.pre td:nth-child(2){text-align:left}
.pre td:first-child{width:28px}
.pre tr.cat td{background:var(--surface-2);font-weight:800;text-align:left;font-size:12.5px;letter-spacing:.02em}
.pre input.input{max-width:140px;text-align:right;min-height:34px;padding:5px 9px;margin-left:auto;display:block}
.pre tr.off td{opacity:.45}
.pre tfoot td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto}
.sticky-foot{position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 2px;border-top:1px solid var(--line)}

.btable{width:100%;border-collapse:collapse}
.btable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 8px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.btable th:first-child{text-align:left}
.btable td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px;white-space:nowrap}
.btable td:first-child{text-align:left;white-space:normal}
.btable tr.cat td{background:var(--surface-2);font-weight:800}
.btable tr.it td:first-child{padding-left:26px;color:var(--muted)}
.btable tfoot td{font-weight:800;border-bottom:0;color:var(--gold)}
.mtab{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mtab div{background:var(--bg);border-radius:9px;padding:6px 8px;font-size:12px}
.mtab small{display:block;color:var(--muted);font-size:10.5px}

.goals{grid-template-columns:1fr}
@media(min-width:700px){.goals{grid-template-columns:repeat(2,1fr)}}
.goal .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{font-size:16px}
.goal .kind{font-size:12px;color:var(--muted)}
.goal .big{font-size:22px;font-weight:800;margin:12px 0 4px}
.goal .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.goal .stats small{display:block;font-size:11px;color:var(--muted)}

<div id="apbn-lock"><div class="lk" id="apbn-lock-card"><div class="lk-logo">Rp</div><h2>APBN</h2><p>Checking access…</p></div></div>
<script>
/* ---------- APBN bridge: talks to the Apps Script API + login (email → code → PIN) ---------- */
(function(){
  const API=(window.APBN_CONFIG&&window.APBN_CONFIG.apiUrl)||'';
  const LS={ get:k=>{ try{ return localStorage.getItem(k); }catch(_){ return null; } }, set:(k,v)=>{ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(_){} } };
  let SESSION=null, DATA=null, MODE='', unlockedOnce=false, hiddenAt=0;
  let EMAIL=LS.get('apbn_email')||'', DEVICE=LS.get('apbn_device')||'';
  const subs=[]; const meta={fromCache:false,hasPendingWrites:false};
  const errMsg=e=>String(e&&e.message||e).replace(/^(Exception|Error):\s*/,'');
  async function call(action,payload={}){
    if(!API) throw new Error('CONFIG');
    let r; try{ r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload}),redirect:'follow'}); }
    catch(e){ throw new Error('Can\'t reach the server. Check your internet connection.'); }
    let j; try{ j=await r.json(); }catch(e){ throw new Error('The server answered unexpectedly. Check the API URL in config.js and that the deployment allows "Anyone".'); }
    if(!j.ok) throw new Error(j.error||'Request failed'); return j.data;
  }
  const run=(name,...args)=>call('api',{session:SESSION,name,args}).catch(e=>{ const m=errMsg(e); if(/LOCKED/.test(m)){ SESSION=null; showLock('unlock','Session expired. Enter your PIN.'); } throw {code:/not registered/i.test(m)?'invalid_argument':'unavailable',message:m}; });
  const snapDoc=(id,obj)=>({id,exists:!!obj,data:()=>obj||undefined,metadata:meta});
  function emit(){ subs.forEach(s=>{ try{ s(); }catch(e){ console.error(e); } }); }
  function apply(d){ if(!d) return; DATA=d; window.__SHEET_URL=d.sheetUrl; emit(); }
  function refresh(){ if(!SESSION) return Promise.resolve(); return run('getAll').then(apply); }
  const collect=name=>{ if(!DATA) return [];
    if(name==='tx') return DATA.tx.map(t=>snapDoc(t.id,t));
    if(name==='goals') return DATA.goals.map(g=>snapDoc(g.id,g));
    if(name==='budgets') return Object.keys(DATA.budgets).map(y=>snapDoc(String(y),DATA.budgets[y]));
    return []; };
  const docOf=path=>{ const [c,id]=path.split('/');
    return {
      async set(d){ let r;
        if(c==='tx') r=await run('saveTx',{...d,id});
        else if(c==='goals') r=await run('saveGoal',{...d,id});
        else if(c==='budgets') r=await run('saveBudget',id,d);
        else if(path==='hh/master') r=await run('saveMaster',d);
        else throw {code:'invalid_argument',message:'Unknown path '+path};
        apply(r); },
      async update(d){ return this.set(d); },
      async delete(){ let r; if(c==='tx') r=await run('deleteTx',id); else if(c==='goals') r=await run('deleteGoal',id); if(r) apply(r); },
      onSnapshot(next){ const f=()=>{ if(DATA && path==='hh/master') next(snapDoc('master',DATA.master)); }; subs.push(f); f(); return ()=>{}; }
    }; };
  const db={ doc:docOf,
    collection:name=>({ doc:id=>docOf(name+'/'+id), onSnapshot(next){ const f=()=>{ if(!DATA) return; const docs=collect(name); next({docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}); }; subs.push(f); f(); return ()=>{}; } }),
    async batchTx(list){ apply(await run('saveTxBatch',list)); },
    async uploadActuals(year,list,replace){ apply(await run('uploadActuals',year,list,replace)); } };
  const user={ async id(){ await ready; return DATA.me; }, async can(){ return true; }, async isOwner(){ return true; },
    async profiles(ids){ const o={}; ids.forEach(i=>o[i]={name:(DATA&&DATA.people[i])||String(i).split('@')[0]}); return o; } };
  const downloads={ async save({filename,data}){ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return {status:'saved'}; } };

  /* ---- login / lock screen ---- */
  let resolveReady; const ready=new Promise(r=>resolveReady=r);
  const $l=id=>document.getElementById(id);
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pinInput=(id,label,auto)=>`<label for="${id}">${label}</label><input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" ${auto?'data-auto="1"':''}>`;
  const codeInput=`<label for="lk-code">6-digit code from your email</label><input id="lk-code" class="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-auto-code="1">`;
  function showLock(mode,msg){
    MODE=mode; const box=$l('apbn-lock'), card=$l('apbn-lock-card'); box.hidden=false;
    const head=`<div class="lk-logo">Rp</div><h2>APBN</h2>`;
    let body='';
    if(mode==='config') body=`<p>The app is not connected yet. Put your Apps Script <b>/exec</b> URL in <b>config.js</b> on GitHub, then reload.</p>`;
    else if(mode==='denied') body=`<p>${esc(msg)}</p><button class="btn" type="button" id="lk-back">Use another email</button>`;
    else if(mode==='email') body=`<p>Sign in with your registered Gmail.</p><label for="lk-email">Email</label><input id="lk-email" type="email" inputmode="email" autocomplete="email" style="font-size:16px;letter-spacing:0;font-weight:600" value="${esc(EMAIL)}"><div class="lk-err" id="lk-err">${esc(msg||'')}</div><button class="btn primary" type="button" id="lk-go">Continue</button>`;
    else if(mode==='verify') body=`<p>New device. We sent a 6-digit code to <b>${esc(EMAIL)}</b>.</p>${codeInput}<div class="lk-err" id="lk-err">${esc(msg||'')}</div><button class="btn primary" type="button" id="lk-go">Verify</button><div class="lk-links"><button class="link" type="button" id="lk-resend">Send again</button><button class="link" type="button" id="lk-back">Change email</button></div>`;
    else if(mode==='create') body=`<p>Create your own 6-digit PIN.</p>${pinInput('lk-pin','New PIN')}${pinInput('lk-pin2','Repeat PIN')}<div class="lk-err" id="lk-err">${esc(msg||'')}</div><button class="btn primary" type="button" id="lk-go">Create PIN</button>`;
    else if(mode==='unlock') body=`<p>${esc(msg||'Enter your PIN')}</p>${pinInput('lk-pin','PIN',true)}<div class="lk-err" id="lk-err"></div><button class="btn primary" type="button" id="lk-go">Unlock</button><div class="lk-links"><button class="link" type="button" id="lk-forgot">Forgot PIN?</button><span class="hint">${esc(EMAIL)}</span></div>`;
    else if(mode==='forgot') body=`<p>We'll email a reset code to <b>${esc(EMAIL)}</b>.</p><button class="btn" type="button" id="lk-send">Email me a code</button><div class="lk-ok" id="lk-ok"></div>${codeInput.replace('data-auto-code="1"','')}${pinInput('lk-pin','New PIN')}${pinInput('lk-pin2','Repeat new PIN')}<div class="lk-err" id="lk-err"></div><button class="btn primary" type="button" id="lk-go">Reset PIN</button><button class="link" type="button" id="lk-back">Back</button>`;
    else if(mode==='change') body=`<p>Change your PIN</p>${pinInput('lk-old','Current PIN')}${pinInput('lk-pin','New PIN')}${pinInput('lk-pin2','Repeat new PIN')}<div class="lk-err" id="lk-err"></div><button class="btn primary" type="button" id="lk-go">Save new PIN</button><button class="link" type="button" id="lk-back">Cancel</button>`;
    else body=`<p>${esc(msg||'Connecting…')}</p>`;
    card.innerHTML=head+body;
    const first=card.querySelector('input'); if(first) setTimeout(()=>first.focus(),60);
    card.querySelectorAll('input').forEach(i=>{
      i.addEventListener('input',()=>{ if(i.inputMode==='numeric') i.value=i.value.replace(/\D/g,'').slice(0,6); if((i.dataset.auto||i.dataset.autoCode) && i.value.length===6) go(); });
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); }); });
    const b=$l('lk-go'); if(b) b.onclick=go;
    if($l('lk-forgot')) $l('lk-forgot').onclick=()=>showLock('forgot');
    if($l('lk-back')) $l('lk-back').onclick=()=>{ if(mode==='change'){ box.hidden=true; } else if(mode==='forgot'){ showLock(DEVICE?'unlock':'email'); } else { showLock('email'); } };
    if($l('lk-resend')) $l('lk-resend').onclick=()=>sendCode(true);
    if($l('lk-send')) $l('lk-send').onclick=async()=>{ const s=$l('lk-send'); s.disabled=true; s.textContent='Sending…'; try{ await call('sendCode',{email:EMAIL}); $l('lk-ok').textContent='Code sent. Check your inbox (and spam).'; s.textContent='Send again'; }catch(e){ $l('lk-err').textContent=errMsg(e); s.textContent='Email me a code'; } s.disabled=false; };
  }
  async function sendCode(again){ try{ await call('sendCode',{email:EMAIL}); if(again && $l('lk-err')) $l('lk-err').textContent='New code sent.'; }catch(e){ if($l('lk-err')) $l('lk-err').textContent=errMsg(e); } }
  async function go(){
    const v=id=>($l(id)||{}).value||''; const err=$l('lk-err'); const b=$l('lk-go'); const six=/^\d{6}$/;
    const fail=m=>{ if(err) err.textContent=m; if(b) b.disabled=false; const p=$l('lk-pin'); if(p && MODE==='unlock'){ p.value=''; p.focus(); } const c=$l('lk-code'); if(c && MODE==='verify'){ c.value=''; c.focus(); } };
    if(b){ if(b.disabled) return; b.disabled=true; }
    try{
      if(MODE==='email'){
        const em=v('lk-email').trim().toLowerCase(); if(!/^\S+@\S+\.\S+$/.test(em)) return fail('Enter a valid email.');
        if(em!==EMAIL){ DEVICE=''; LS.set('apbn_device',null); }
        EMAIL=em; LS.set('apbn_email',em);
        const st=await call('hello',{email:EMAIL,device:DEVICE});
        if(st.known) showLock(st.hasPin?'unlock':'create');
        else { DEVICE=''; LS.set('apbn_device',null); showLock('verify'); sendCode(false); }
      }
      else if(MODE==='verify'){ if(!six.test(v('lk-code'))) return fail('Enter the 6-digit code.'); const r=await call('verifyCode',{email:EMAIL,code:v('lk-code')}); DEVICE=r.device; LS.set('apbn_device',DEVICE); showLock(r.hasPin?'unlock':'create', r.hasPin?'Device verified. Enter your PIN.':''); }
      else if(MODE==='create'){ if(!six.test(v('lk-pin'))) return fail('Use exactly 6 digits.'); if(v('lk-pin')!==v('lk-pin2')) return fail('The two PINs do not match.'); unlocked((await call('createPin',{email:EMAIL,device:DEVICE,pin:v('lk-pin')})).session); }
      else if(MODE==='unlock'){ if(!six.test(v('lk-pin'))) return fail('Enter 6 digits.'); unlocked((await call('unlock',{email:EMAIL,device:DEVICE,pin:v('lk-pin')})).session); }
      else if(MODE==='forgot'){ if(!six.test(v('lk-code').trim())) return fail('Enter the 6-digit code from the email.'); if(!six.test(v('lk-pin'))) return fail('New PIN must be 6 digits.'); if(v('lk-pin')!==v('lk-pin2')) return fail('The two PINs do not match.');
        const r=await call('resetPin',{email:EMAIL,device:DEVICE,code:v('lk-code').trim(),pin:v('lk-pin')}); DEVICE=r.device; LS.set('apbn_device',DEVICE); unlocked(r.session); }
      else if(MODE==='change'){ if(!six.test(v('lk-pin'))) return fail('New PIN must be 6 digits.'); if(v('lk-pin')!==v('lk-pin2')) return fail('The two PINs do not match.'); await call('changePin',{session:SESSION,oldPin:v('lk-old'),pin:v('lk-pin')}); $l('apbn-lock').hidden=true; if(window.toast) toast('PIN changed'); }
    }catch(e){ const m=errMsg(e);
      if(m==='DEVICE'){ DEVICE=''; LS.set('apbn_device',null); showLock('verify','This device was signed out. Enter the new code.'); sendCode(false); return; }
      if(/not registered/i.test(m) && MODE==='email') return showLock('denied',m);
      fail(m); }
  }
  function unlocked(session){
    SESSION=session; $l('apbn-lock').hidden=true;
    refresh().then(()=>{ if(!unlockedOnce){ unlockedOnce=true; resolveReady(); } }).catch(e=>showLock('denied',errMsg(e)));
  }
  window.__apbnLock=async mode=>{
    if(mode==='lock'){ call('lock',{session:SESSION}).catch(()=>{}); SESSION=null; showLock('unlock','Locked. Enter your PIN.'); }
    else if(mode==='signout'){ call('lock',{session:SESSION}).catch(()=>{}); SESSION=null; DEVICE=''; LS.set('apbn_device',null); showLock('email','Signed out of this device.'); }
    else if(mode==='signoutall'){ try{ await call('signOutAll',{session:SESSION}); }catch(_){} SESSION=null; DEVICE=''; LS.set('apbn_device',null); showLock('email','All devices signed out. Sign in again on each device.'); }
    else showLock('change');
  };
  (async()=>{
    if(!API) return showLock('config');
    if(!EMAIL) return showLock('email');
    try{ const st=await call('hello',{email:EMAIL,device:DEVICE}); if(st.known) showLock(st.hasPin?'unlock':'create'); else showLock('email'); }
    catch(e){ const m=errMsg(e); if(/not registered/i.test(m)) showLock('denied',m); else showLock('email',m); }
  })();
  setInterval(()=>{ if(SESSION && !document.hidden) refresh().catch(()=>{}); },30000);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ hiddenAt=Date.now(); return; }
    if(SESSION && hiddenAt && Date.now()-hiddenAt>5*60000){ SESSION=null; showLock('unlock','Locked after 5 minutes away. Enter your PIN.'); return; }
    if(SESSION) refresh().catch(()=>{});
  });
  window.claude={ use: async n=>{ await ready; return ({db,user,downloads})[n]||null; } };
})();
/* ---- install app (PWA) ---- */
window.__apbnInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window.__apbnInstall=e; });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M15 17H7V9"/></svg>',
  piggy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7l7-4 7 4v4M6 11v8M10 11v8M14 11v8M18 11v8M3 21h18"/></svg>',

};
const VIEWS = [{id:'overview',label:'Overview'},{id:'entries',label:'Entries'},{id:'budget',label:'Budget'},{id:'goals',label:'Goals'},{id:'setup',label:'Setup'}];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEFAULTS = {
  expenseCats:[
    {name:'Housing', items:['House Rent','Electricity','Water','Internet & Phone']},
    {name:'Food', items:['Groceries','Dining Out','Snacks & Drinks']},
    {name:'Transportation', items:['Fuel','Service & Maintenance','Vehicle Tax','Parking & Toll']},
    {name:'Children & Education', items:['School Fees','Books & Supplies','Courses']},

function incomePlan(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7)-1; const byItem={}; let total=0;
  for(const l of incomeLines(y)){ const v=+l.m?.[m]||0; total+=v; byItem[key(l.cat,l.item)]=(byItem[key(l.cat,l.item)]||0)+v; }
  return {total, byItem};
}
function savingPlan(ym){ return incomePlan(ym).total - monthBudget(ym).total; }
function monthBudget(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7)-1; const byCat={}, byItem={}; let total=0;
  for(const l of budgetLines(y)){ const v=+l.m?.[m]||0; if(!v) continue; total+=v; byCat[l.cat]=(byCat[l.cat]||0)+v; byItem[key(l.cat,l.item)]=(byItem[key(l.cat,l.item)]||0)+v; }
  return {total, byCat, byItem};
}
function monthStats(ym, list = visibleTx()){
  let income=0, spent=0, returned=0, saved=0, allocated=0; const byCat={}, byItem={};
  for(const t of list){ if(t.ym!==ym) continue;
    if(t.type==='income') income+=t.amount;
    if(t.type==='expense'){ spent+=t.amount; if(t.source==='allocation') allocated+=t.amount; }
    if(t.type==='return') returned+=t.amount;
    if(t.type==='saving') saved+=t.amount;
    const c=signedCost(t); if(c){ byCat[t.cat]=(byCat[t.cat]||0)+c; byItem[key(t.cat,t.item)]=(byItem[key(t.cat,t.item)]||0)+c; }
  }
  const b=monthBudget(ym);
  return {income, spent, returned, allocated, saved, cost:spent-returned, net:income-(spent-returned), byCat, byItem, budget:b};
}
function balances(){
  const b={}; for(const a of S.master.accounts) b[a.id]=+a.opening||0;
  const add=(id,v)=>{ if(id in b) b[id]+=v; };
  for(const t of S.tx){
    if(t.type==='income'||t.type==='return') add(t.acc,t.amount);
    else if(t.type==='expense') add(t.acc,-t.amount);
    else if(t.type==='transfer'){ add(t.acc,-t.amount); add(t.toAcc,t.amount); }
    else if(t.type==='saving') add(t.acc,-t.amount);
  }
  return b;
}

function catTree(ym){
  const tree=[]; const seen={};
  const addC = c => { if(!(c in seen)){ seen[c]={name:c, items:[]}; tree.push(seen[c]); } return seen[c]; };
  const addI = (c,i) => { const n=addC(c); if(i && !n.items.includes(i)) n.items.push(i); };
  for(const c of S.master.expenseCats){ addC(c.name); for(const i of c.items||[]) addI(c.name,i); }
  for(const l of budgetLines(+ym.slice(0,4))) addI(l.cat,l.item);
  for(const t of S.tx) if((t.type==='expense'||t.type==='return') && t.ym===ym) addI(t.cat,t.item);
  return tree;
}

function txEffect(t, accId){
  // returns {inc,ret,tin,tout,exp,sav} for one account
  const e={inc:0,ret:0,tin:0,tout:0,exp:0,sav:0};
  if(t.type==='income'&&t.acc===accId) e.inc=t.amount;
  else if(t.type==='return'&&t.acc===accId) e.ret=t.amount;
  else if(t.type==='expense'&&t.acc===accId) e.exp=t.amount;
  else if(t.type==='saving'&&t.acc===accId) e.sav=t.amount;
  else if(t.type==='transfer'){ if(t.acc===accId) e.tout=t.amount; if(t.toAcc===accId) e.tin=t.amount; }
  return e;
}

  return S.master.accounts.map(a=>{

    for(const t of S.tx){ const e=txEffect(t,a.id); const net=e.inc+e.ret+e.tin-e.tout-e.exp-e.sav;
      if(ymIdx(t.ym)<start) open+=net; else if(months.has(t.ym)) for(const k in m) m[k]+=e[k]; }

}

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function trendSvg(months){
  const W=520,H=210,pl=46,pr=10,pt=12,pb=28, iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp])); const minNet=Math.min(0,...months.map(m=>m.net));
  const top=niceMax(max), bottom=minNet<0?-niceMax(-minNet):0; const y=v=>pt+ih*(top-v)/(top-bottom);
  const gw=iw/months.length, bw=Math.min(18,gw/3.2); let g='', bars='', pts=[];
  for(let i=0;i<=4;i++){ const v=bottom+(top-bottom)*i/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${rpShort(v).replace('Rp ','')}</text>`; }
  months.forEach((m,i)=>{ const cx=pl+gw*i+gw/2;
    bars+=`<rect x="${cx-bw-1.5}" y="${y(Math.max(0,m.inc))}" width="${bw}" height="${Math.max(0,y(0)-y(m.inc))}" rx="3" fill="var(--income)"><title>Income ${rp(m.inc)}</title></rect>`;
    bars+=`<rect x="${cx+1.5}" y="${y(Math.max(0,m.exp))}" width="${bw}" height="${Math.max(0,y(0)-y(m.exp))}" rx="3" fill="var(--expense)"><title>Expenses ${rp(m.exp)}</title></rect>`;
    bars+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="${m.ym===S.ym?'var(--ink)':'var(--muted)'}" font-weight="${m.ym===S.ym?700:500}">${MONTHS[+m.ym.slice(5,7)-1]}</text>`;
    pts.push([cx,y(m.net),m]); });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"><title>Net ${rp(p[2].net)}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income, expenses and net saving for the last six months">${g}${bars}<path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.2"/>${dots}</svg>`;
}

    <div class="mtab num" style="margin-top:12px">${MONTHS.map((mn,k)=>{ const ym=`${y}-${String(k+1).padStart(2,'0')}`; const v=savingPlan(ym); return `<div><small>${mn} est. saving</small><span class="${v<0?'c-out':''}">${rpShort(v)}</span></div>`; }).join('')}</div></div>`;
  let incCard='';
  if(inc.length){ const itree={}; for(const l of inc){ (itree[l.cat]=itree[l.cat]||[]).push(l); } let ir='';
    const act=(cat,item)=>S.tx.filter(t=>t.type==='income'&&t.ym===S.ym&&t.cat===cat&&(item==null||t.item===item)&&(S.member==='all'||t.by===S.member)).reduce((s,t)=>s+t.amount,0);

      ir+=`<tr class="cat"><td>${emojiFor(cat)} ${esc(cat)}</td><td class="num">${rp(f)}</td><td class="num">${rp(a)}</td><td class="num ${a-f<0?'c-out':'c-in'}">${rp(a-f)}</td><td class="num">${rp(sumY(ls))}</td></tr>`;
      for(const l of ls){ const fi=+l.m[mi]||0, ai=act(cat,l.item);
        ir+=`<tr class="it"><td>${esc(l.item)}</td><td class="num">${rp(fi)}</td><td class="num">${rp(ai)}</td><td class="num ${ai-fi<0?'c-out':'c-in'}">${rp(ai-fi)}</td><td class="num">${rp(l.m.reduce((x,z)=>x+(+z||0),0))}</td></tr>`; } }
    incCard=`<div class="card"><div class="card-h"><h2>${ymLabel(S.ym,true)} · income forecast vs actual</h2><span class="meta">Planning only · record actual income as entries</span></div>
      <div class="scroll"><table class="btable"><thead><tr><th>Category / item</th><th>Forecast</th><th>Actual</th><th>Difference</th><th>Year ${y}</th></tr></thead><tbody>${ir}</tbody></table></div></div>`; }
  if(!lines.length && !inc.length) return `<div class="grid">${head}</div>`;
  const tree={}; for(const l of lines){ (tree[l.cat]=tree[l.cat]||[]).push(l); }
  let rows='', tb=0, ta=0, ty=0;
  for(const [cat,ls] of Object.entries(tree)){
    const cb=ls.reduce((s,l)=>s+(+l.m[mi]||0),0), ca=m.byCat[cat]||0, cy=ls.reduce((s,l)=>s+l.m.reduce((a,b)=>a+(+b||0),0),0); tb+=cb; ta+=ca; ty+=cy; const st=status(ca,cb);
    const open = S.openCats[cat]!==false;
    rows+=`<tr class="cat" data-action="toggle-cat" data-cat="${esc(cat)}" style="cursor:pointer"><td>${open?'▾':'▸'} ${emojiFor(cat)} ${esc(cat)}</td><td class="num">${rp(cb)}</td><td class="num">${rp(ca)}</td><td class="num ${cb-ca<0?'c-out':''}">${rp(cb-ca)}</td><td><span class="pill ${st}">${cb?Math.round(ca/cb*100)+'%':statusText[st]}</span></td><td class="num">${rp(cy)}</td></tr>`;
    if(open) for(const l of ls){ const b=+l.m[mi]||0, a=m.byItem[key(cat,l.item)]||0;
      rows+=`<tr class="it"><td>${esc(l.item)}</td><td class="num">${rp(b)}</td><td class="num">${rp(a)}</td><td class="num ${b-a<0?'c-out':''}">${rp(b-a)}</td><td></td><td class="num">${rp(l.m.reduce((x,z)=>x+(+z||0),0))}</td></tr>`; }
  }
  const extra = Object.keys(m.byCat).filter(c=>!tree[c] && m.byCat[c]);
  for(const c of extra){ ta+=m.byCat[c]; rows+=`<tr class="cat"><td>${emojiFor(c)} ${esc(c)} <span class="pill over">Not in budget</span></td><td class="num">${rp(0)}</td><td class="num">${rp(m.byCat[c])}</td><td class="num c-out">${rp(-m.byCat[c])}</td><td></td><td class="num">${rp(0)}</td></tr>`; }
  return `<div class="grid">${head}${est}${incCard}<div class="card"><div class="card-h"><h2>${ymLabel(S.ym,true)} · expense budget vs actual</h2><span class="meta">Actual = expenses − returned unused</span></div>
    <div class="scroll"><table class="btable"><thead><tr><th>Category / item</th><th>Budget</th><th>Actual</th><th>Remaining</th><th>Used</th><th>Year ${y}</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td>Total</td><td class="num">${rp(tb)}</td><td class="num">${rp(ta)}</td><td class="num">${rp(tb-ta)}</td><td><span class="pill ${status(ta,tb)}">${tb?Math.round(ta/tb*100)+'%':'—'}</span></td><td class="num">${rp(ty)}</td></tr></tfoot></table></div></div></div>`;
}
function viewGoals(){

    const pct=useG?p.grams/g.targetGrams*100:(+g.target?p.amt/g.target*100:0); const left=g.targetYm?ymIdx(g.targetYm)-cur+1:0;
    const remA=Math.max(0,(+g.target||0)-p.amt), remG=Math.max(0,(+g.targetGrams||0)-p.grams);

    const big=useG?`${p.grams.toFixed(2)} g <span class="c-muted" style="font-size:14px;font-weight:600">of ${(+g.targetGrams).toFixed(0)} g</span>`:`${rpShort(p.amt)} <span class="c-muted" style="font-size:14px;font-weight:600">of ${rpShort(+g.target||0)}</span>`;

}

let F=null;
function openTx(t, preset={}){
  F = t ? {...structuredClone(t), step:'amount'} : {type:'expense', ym:todayYm(), amount:0, cat:'', item:'', acc:defaultAcc(), toAcc:S.master.accounts[1]?.id, goal:S.goals[0]?.id, grams:'', note:'', withdraw:false, step:'cat', ...preset};
  if(t && t.type==='saving' && t.amount<0){ F.withdraw=true; F.amount=-t.amount; }
  if(F.type==='saving'||F.type==='transfer'||F.type==='return') F.step='amount';
  F._new=!t; $('#sheet').className='sheet'; renderSheet(); $('#modal').hidden=false;
}
function catsFor(type){ return type==='income' ? S.master.incomeCats : S.master.expenseCats; }

      <div class="actions"><button class="btn primary" type="button" data-action="confirm-new">Continue</button></div>`;

    const c=catsFor(t.type).find(c=>c.name===t.cat); const items=c?.items?.length?c.items:[t.cat];

      <div class="tiles">${items.map((it,i)=>{ const bb=b.byItem[key(t.cat,it)]; const left=bb!=null? bb-(m.byItem[key(t.cat,it)]||0):null;

        <button class="tile item add" type="button" data-action="new-item">＋ New item<small>Adds to Setup</small></button></div>`;
  } else {
    const crumb = (t.type==='expense'||t.type==='income'||t.type==='return') ? `<div class="crumb">${t.type==='return'?`<span>${emojiFor(t.cat)} ${esc(t.cat)}</span>`:`<button type="button" data-action="step" data-s="cat">${emojiFor(t.cat)} ${esc(t.cat)}</button>`}<span class="sep">›</span>${t.type==='return'?`<span>${esc(t.item)}</span>`:`<button type="button" data-action="step" data-s="item">${esc(t.item||'—')}</button>`}</div>` : '';

      </div>

  }
  $('#sheet').innerHTML=`<div class="sheet-h"><h2>${t._new?'New entry':'Edit entry'}</h2><button class="x" type="button" data-action="close" aria-label="Close">✕</button></div>${typeSeg}${monthPick}${body}`;
  if(t.step==='amount') setTimeout(()=>{ const a=$('#f-amount'); if(a && t._new) a.focus(); },30);

  if(t.step==='newitem') setTimeout(()=>{ if(freeFocus()) $('#f-newitem')?.focus(); },30);
}
function readForm(){
  const v=id=>$('#'+id)?.value;
  if($('#f-ym')) F.ym=v('f-ym')||F.ym;
  if($('#f-amount')) F.amount=digits(v('f-amount'));
  if($('#f-note')) F.note=v('f-note'); if($('#f-acc')) F.acc=v('f-acc'); if($('#f-to')) F.toAcc=v('f-to');
  if($('#f-goal')) F.goal=v('f-goal'); if($('#f-grams')) F.grams=v('f-grams'); if($('#f-withdraw')) F.withdraw=$('#f-withdraw').checked;
}
function txDoc(o){
  const d={type:o.type, ym:o.ym, amount:o.amount, acc:o.acc, note:(o.note||'').trim(), by:o.by||S.me||'unknown', source:o.source||'manual', createdAt:o.createdAt||Date.now(), updatedAt:Date.now()};
  if(o.type==='expense'||o.type==='income'||o.type==='return'){ d.cat=o.cat; d.item=o.item||o.cat; }
  if(o.type==='transfer') d.toAcc=o.toAcc;
  if(o.type==='saving'){ d.goal=o.goal; d.amount=o.withdraw?-o.amount:o.amount; const g=+o.grams||0; if(goalOf(o.goal)?.kind==='gold'&&g) d.grams=o.withdraw?-Math.abs(g):Math.abs(g); }
  return d;
}
async function saveTx(btn){
  readForm();
  const err=!F.amount?'Enter an amount.':!/^\d{4}-\d{2}$/.test(F.ym)?'Pick a month.':F.type==='transfer'&&F.acc===F.toAcc?'Choose two different accounts.':F.type==='saving'&&!goalOf(F.goal)?'Create a goal first (Goals tab).':(F.type==='expense'||F.type==='income')&&!F.cat?'Choose a category.':'';
  if(err){ $('#f-err').textContent=err; return; }
  if(!S.db){ toast('Not saved: saved data is unavailable here.'); return; }
  btn.disabled=true; const isNew=F._new; const {type,cat,item}=F;
  try{
    await S.db.doc('tx/'+(F.id||uid('tx'))).set(txDoc(F)); const ym=F.ym; closeModal();
    let added='';
    if(type==='expense'||type==='income'){ try{ added=await ensureMaster(type,cat,item); }catch(_){ added='!'; } }
    toast(added==='!' ? 'Saved, but Setup could not be updated' : added ? `Saved · ${added} added to Setup` : (isNew?'Saved':'Updated'));
    if(ym!==S.ym){ S.ym=ym; render(); }
  }
  catch(e){ btn.disabled=false; handleWriteErr(e); }

/* ---------- Budget upload / download ---------- */
function parseBudgetWorkbook(wb){
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true}); let h=-1;
    for(let i=0;i<Math.min(rows.length,40);i++){ const r=rows[i].map(x=>String(x).trim().toLowerCase()); if(r.includes('category')&&r.includes('item')){ h=i; break; } }
    if(h<0) continue;
    const hr=rows[h].map(x=>String(x).trim().toLowerCase()); const ci=hr.indexOf('category'), ii=hr.indexOf('item'), ti=hr.indexOf('type');
    const incNames=new Set(S.master.incomeCats.map(c=>c.name.toLowerCase()));
    const mi=MONTHS.map(mn=>hr.findIndex(x=>x.slice(0,3)===mn.toLowerCase()));
    if(mi.some(x=>x<0)) return {error:`Sheet "${name}" has Category and Item, but not all month columns Jan to Dec.`};
    let year=null;
    for(let i=0;i<h;i++){ const r=rows[i]; for(let j=0;j<r.length;j++){ if(/^year/i.test(String(r[j]).trim())){ for(let k=j+1;k<Math.min(r.length,j+4);k++){ const v=+String(r[k]).trim(); if(v>2000&&v<2100){ year=v; break; } } } } }
    const map=new Map(); let lastCat='', lastType='expense', skipped=0;
    for(let i=h+1;i<rows.length;i++){ const r=rows[i]; let cat=String(r[ci]??'').trim(), item=String(r[ii]??'').trim();
      const tv=ti>=0?String(r[ti]??'').trim().toLowerCase():'';
      if(/^(grand\s*)?total/i.test(cat)||/^(sub\s*)?total/i.test(item)||/total/.test(tv)) continue;
      if(!cat&&!item) continue; const blankCat=!cat; if(!cat) cat=lastCat; if(!cat){ skipped++; continue; } if(!item) item=cat;
      const type = tv.startsWith('inc') ? 'income' : tv.startsWith('exp') ? 'expense' : (blankCat||cat===lastCat) ? lastType : (incNames.has(cat.toLowerCase())?'income':'expense');
      lastCat=cat; lastType=type;
      const m=mi.map(j=>{ const v=r[j]; return typeof v==='number'? Math.round(v) : digits(v); });
      const k=type+'|'+key(cat,item); if(map.has(k)){ const e=map.get(k); e.m=e.m.map((x,z)=>x+m[z]); } else map.set(k,{type,cat,item,m}); }
    const lines=[...map.values()];
    if(!lines.length) return {error:`Sheet "${name}" has the header row but no budget lines below it.`};
    return {lines, year, sheet:name, skipped};
  }
  return {error:'No sheet with a header row containing "Category" and "Item" was found.'};
}

  const y=A.year; const inc=MONTHS.map((_,i)=>A.lines.filter(l=>l.type==='income').reduce((s,l)=>s+l.m[i],0)); const exp=MONTHS.map((_,i)=>A.lines.filter(l=>l.type!=='income').reduce((s,l)=>s+l.m[i],0));

  const other=S.tx.filter(t=>t.source!=='upload'&&months.has(t.ym)&&(t.type==='expense'||t.type==='income'||t.type==='return')).length;
  const unknownAcc=[...new Set(A.lines.filter(l=>l.account&&!S.master.accounts.some(a=>a.name.toLowerCase()===l.account.toLowerCase())).map(l=>l.account))];
  const accOpts=S.master.accounts.map(a=>`<option value="${a.id}" ${a.id===A.acc?'selected':''}>${esc(a.name)}</option>`).join('');
  $('#sheet').innerHTML=`<div class="sheet-h"><h2>📥 Upload actuals · check before saving</h2><button class="x" type="button" data-action="close" aria-label="Close">✕</button></div>
    <div class="hint">${esc(A.fileName)} · sheet “${esc(A.sheet)}” · ${A.lines.length} items → <b>${n} entries</b></div>
    <div class="row2"><div class="field"><label for="a-year">Year</label><input class="input num" id="a-year" type="number" min="2020" max="2099" value="${y}"></div>
      <div class="field"><label for="a-acc">Account for rows without one</label><select class="input" id="a-acc">${accOpts}</select></div></div>
    <div class="row2"><div class="field"><span class="lbl">Income (year)</span><div class="num c-in" style="font-size:20px;font-weight:800">${rp(inc.reduce((a,b)=>a+b,0))}</div></div>
      <div class="field"><span class="lbl">Expenses (year)</span><div class="num c-out" style="font-size:20px;font-weight:800">${rp(exp.reduce((a,b)=>a+b,0))}</div></div></div>
    <div class="lbl">Monthly expenses in the file</div><div class="mtab num">${exp.map((v,i)=>`<div><small>${MONTHS[i]}</small>${v?rpShort(v):'—'}</div>`).join('')}</div>
    <label class="check"><input type="checkbox" id="a-replace" ${A.replace?'checked':''}> Replace earlier uploaded actuals for ${y} (${prev} entries). Manual, payday and return entries are never touched.</label>
    ${other?`<div class="banner">${other} manual/payday/return entries already exist in these months. Check the file does not count them twice.</div>`:''}
    ${unknownAcc.length?`<div class="banner">Account names not found in Setup: ${esc(unknownAcc.join(', '))}. Those rows use the account selected above.</div>`:''}
    <div class="err" id="p-err"></div>

}
async function saveActualUpload(btn){
  const year=Math.round(+$('#a-year').value); if(!(year>2000&&year<2100)){ $('#p-err').textContent='Enter a valid year.'; return; }
  A.acc=$('#a-acc').value; A.replace=$('#a-replace').checked; btn.disabled=true; btn.textContent='Saving…';
  const now=Date.now(); const docs=[]; let k=0;
  for(const l of A.lines) l.m.forEach((v,i)=>{ if(!v) return; docs.push({id:uid('tx')+(k), ...txDoc({type:l.type, ym:`${year}-${String(i+1).padStart(2,'0')}`, cat:l.cat, item:l.item, amount:v, acc:actualAcc(l), source:'upload', note:'Bulk upload', createdAt:now+(k++)})}); });
  try{
    await S.db.uploadActuals(year, docs, A.replace);
    const m=structuredClone(S.master); let changed=false;
    for(const l of A.lines){ const list=l.type==='income'?m.incomeCats:m.expenseCats; let c=list.find(c=>c.name===l.cat); if(!c){ c={name:l.cat,items:[]}; list.push(c); changed=true; } if(!c.items.includes(l.item)){ c.items.push(l.item); changed=true; } }
    if(changed) await S.db.doc('hh/master').set({...m, updatedAt:Date.now()});
    closeModal(); A=null; toast(`${docs.length} entries saved`); S.view='entries'; render();
  }catch(e){ btn.disabled=false; btn.textContent='Retry'; handleWriteErr(e); }
}
async function downloadActualTemplate(btn){
  if(typeof XLSX==='undefined'){ toast('Excel library didn\'t load. Reload and try again.'); return; }
  const y=+S.ym.slice(0,4);
  const lines=S.master.incomeCats.flatMap(c=>(c.items?.length?c.items:[c.name]).map(i=>['Income',c.name,i])).concat(S.master.expenseCats.flatMap(c=>(c.items?.length?c.items:[c.name]).map(i=>['Expense',c.name,i])));
  const aoa=[['Household Actuals Upload — APBN'],['Year',y],['One row per item. Amounts in Rupiah in the month they happened. Account is optional (name as in Setup).'],[],['Type','Category','Item','Account',...MONTHS,'Total']];
  lines.forEach((l,i)=>{ const r=6+i; aoa.push([...l,'',...Array(12).fill(null),{f:`SUM(E${r}:P${r})`}]); });
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:10},{wch:26},{wch:30},{wch:18},...MONTHS.map(()=>({wch:12})),{wch:14}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Actuals_Upload');
  btn.disabled=true;
  try{ await S.downloads.save({filename:`Household_Actuals_Upload_${y}.xlsx`, data:new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})])}); }
  catch(e){ toast('Download failed. Try again.'); } finally{ btn.disabled=false; }
}

/* ---------- Export ---------- */
const excelSerial = ym => (Date.UTC(+ym.slice(0,4), +ym.slice(5,7)-1, 1) - Date.UTC(1899,11,30))/86400000;
async function exportXlsx(btn){
  if(typeof XLSX==='undefined'){ toast('Export library didn\'t load. Reload and try again.'); return; }
  btn.disabled=true;
  try{
    const ids=[...new Set(S.tx.map(t=>t.by).filter(Boolean))];
    try{ if(S.user&&ids.length){ const ps=await S.user.profiles(ids); for(const id of ids) if(ps?.[id]?.name) S.names[id]=ps[id].name; } }catch(_){}
    const who=id=>S.names[id]||(id===S.me?'Me':'Member');
    const txRows=[['Tx ID','Date','Period','Year','Month','Type','Category','Account','To Account','Goal','Amount','Cost Months','Monthly Cost','Cost Start Idx','Cost End Idx','Gold Grams','Recorded By','Note','Item','Source']];
    for(const t of [...S.tx].sort((a,b)=>a.ym.localeCompare(b.ym)||(a.createdAt||0)-(b.createdAt||0))){
      const y=+t.ym.slice(0,4), m=+t.ym.slice(5,7), idx=y*12+m;
      const type={income:'Income',expense:'Expense',return:'Expense',transfer:'Transfer',saving:'Saving'}[t.type];
      const amt=t.type==='return'?-t.amount:t.amount;
      const src={allocation:'Allocation',return:'Return',upload:'Upload'}[t.source]||'Manual';
      txRows.push([t.id,excelSerial(t.ym),t.ym,y,m,type,t.cat||'',accName(t.acc),t.type==='transfer'?accName(t.toAcc):'',t.type==='saving'?(goalOf(t.goal)?.name||''):'',amt,1,amt,idx,idx,+t.grams||0,who(t.by),t.note||'',t.item||'',src]);
    }
    const bRows=[['Period','Year','Month','Period Idx','Category','Budget','Item','Type']];
    Object.keys(S.budgets).sort().forEach(y=>{ for(const t of ['expense','income']) for(const l of (S.budgets[y].lines||[]).filter(l=>(l.type==='income')===(t==='income'))) l.m.forEach((v,i)=>{ if(+v) bRows.push([`${y}-${String(i+1).padStart(2,'0')}`,+y,i+1,+y*12+i+1,l.cat,+v,l.item,t==='income'?'Income':'Expense']); }); });
    const gRows=[['Goal ID','Goal','Kind','Target (IDR)','Target Grams','Target Period','Saved (IDR)','Saved Grams']];
    for(const g of S.goals){ const p=goalProgress(g); gRows.push([g.id,g.name,g.kind==='gold'?'Gold':'Cash',+g.target||0,+g.targetGrams||0,g.targetYm||'',p.amt,p.grams]); }
    const ex=[...new Set(S.master.expenseCats.map(c=>c.name).concat(Object.values(S.budgets).flatMap(b=>(b.lines||[]).map(l=>l.cat))).concat(S.tx.filter(t=>t.type==='expense'||t.type==='return').map(t=>t.cat)))].filter(Boolean);
    const inc=[...new Set(S.master.incomeCats.map(c=>c.name).concat(S.tx.filter(t=>t.type==='income').map(t=>t.cat)))].filter(Boolean);
    const cRows=[['Expense Category','Income Category']]; for(let i=0;i<Math.max(ex.length,inc.length);i++) cRows.push([ex[i]||'',inc[i]||'']);
    const bal=balances(); const aRows=[['Account','Opening Balance','Current Balance','Type','Owner']]; for(const a of S.master.accounts) aRows.push([a.name,+a.opening||0,bal[a.id],a.kind||'',a.owner||'']);
    const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet(txRows);
    for(let r=1;r<txRows.length;r++){ const c=ws[XLSX.utils.encode_cell({r,c:1})]; if(c) c.z='mmm-yyyy'; }
    XLSX.utils.book_append_sheet(wb,ws,'Transactions'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bRows),'Budgets');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gRows),'Goals'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cRows),'Categories');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aRows),'Accounts');
    await S.downloads.save({filename:'Household_App_Export.xlsx', data:new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})])}); toast('Export ready');
  }catch(e){ toast(e?.code==='declined'?'Download cancelled':e?.code==='rate_limited'?'A download prompt is already open':'Export failed. Please try again.'); }
  finally{ btn.disabled=false; }
}

/* ---------- Events ---------- */
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-action]'); if(!el){ if(e.target.id==='modal') closeModal(); return; }
  const a=el.dataset.action;
  if(a==='go'){ S.view=el.dataset.view; location.hash=S.view; S.setupDraft=null; render(); window.scrollTo(0,0); }
  else if(a==='prev-month'||a==='next-month'){ S.ym=idxYm(ymIdx(S.ym)+(a==='prev-month'?-1:1)); render(); }
  else if(a==='member'){ S.member=el.dataset.id; render(); }
  else if(a==='theme'){ setTheme(document.documentElement.dataset.theme==='light'?'dark':'light'); }
  else if(a==='toggle-pa'){ S.paOpen = S.paOpen===false; render(); }
  else if(a==='bh-mode'){ S.bhMode=el.dataset.m; render(); }
  else if(a==='cf-mode'){ S.cfMode=el.dataset.m; render(); }
  else if(a==='new-tx') openTx(null);
  else if(a==='new-saving') openTx(null,{type:'saving',goal:el.dataset.id});
  else if(a==='edit-tx'){ const t=S.tx.find(x=>x.id===el.dataset.id); if(t) openTx(t); }
  else if(a==='ftx-type'){ readForm(); const t=el.dataset.t; if(t!==F.type){ F.type=t; F.cat=''; F.item=''; F.step=(t==='expense'||t==='income')?'cat':'amount'; if(t==='saving'&&!F.goal) F.goal=S.goals[0]?.id; } renderSheet(); }
  else if(a==='pick-cat'){ readForm(); const c=catsFor(F.type)[+el.dataset.i]; F.cat=c.name; if(c.items?.length>1){ F.step='item'; } else { F.item=c.items?.[0]||c.name; F.step='amount'; } renderSheet(); }
  else if(a==='pick-item'){ readForm(); const c=catsFor(F.type).find(c=>c.name===F.cat); F.item=(c?.items?.length?c.items:[F.cat])[+el.dataset.i]; F.step='amount'; renderSheet(); }
  else if(a==='step'){ readForm(); F.step=el.dataset.s; renderSheet(); }
  else if(a==='new-cat'){ readForm(); F.step='newcat'; renderSheet(); }
  else if(a==='new-item'){ readForm(); F.step='newitem'; renderSheet(); }
  else if(a==='confirm-new') confirmNew();
  else if(a==='save-tx') saveTx(el);
  else if(a==='del-tx') delTx(el);
  else if(a==='close') closeModal();
  else if(a==='ftype'){ S.entryFilter.type=el.dataset.t; render(); }
  else if(a==='allocate') openAllocate();
  else if(a==='return') openReturn();
  else if(a==='pre-all'){ P.lines.forEach(l=>{ l.on=el.dataset.v==='1' && (P.mode==='return' || l.amt>0); }); renderPre(); }
  else if(a==='pre-full'){ P.lines.forEach(l=>{ if(l.alloc>0){ l.amt=Math.min(l.alloc,l.net); l.on=true; } }); renderPre(); }
  else if(a==='pre-run') runPre(el);
  else if(a==='toggle-cat'){ const c=el.dataset.cat; S.openCats[c]=S.openCats[c]===false; render(); }
  else if(a==='upload-budget'){ $('#budgetFile').value=''; $('#budgetFile').click(); }
  else if(a==='save-upload') saveUpload(el);
  else if(a==='dl-budget') downloadBudget(el);
  else if(a==='upload-actuals'){ $('#actualFile').value=''; $('#actualFile').click(); }
  else if(a==='save-actuals') saveActualUpload(el);
  else if(a==='dl-actuals') downloadActualTemplate(el);
  else if(a==='new-goal') openGoal(null);
  else if(a==='edit-goal'){ const g=goalOf(el.dataset.id); if(g) openGoal(g); }
  else if(a==='goal-kind'){ readGoal(); G.kind=el.dataset.k; renderGoalSheet(); }
  else if(a==='save-goal') saveGoal(el);
  else if(a==='del-goal'){ if(!el.classList.contains('armed')){ el.classList.add('armed'); el.textContent='Tap again to delete'; return; } el.disabled=true; try{ await S.db.doc('goals/'+G.id).delete(); closeModal(); toast('Goal deleted'); }catch(err){ el.disabled=false; handleWriteErr(err); } }
  else if(a==='add-cat'){ S.setupDraft[el.dataset.k].push({name:'New category',items:[]}); $('#view').innerHTML=viewSetup(); }
  else if(a==='del-cat'){ S.setupDraft[el.dataset.k].splice(+el.dataset.i,1); $('#view').innerHTML=viewSetup(); }
  else if(a==='add-acc'){ S.setupDraft.accounts.push({id:uid('acc'),name:'New account',kind:'Bank',owner:'Husband',opening:0}); $('#view').innerHTML=viewSetup(); }
  else if(a==='del-acc'){ if(S.setupDraft.accounts.length<=1) return toast('Keep at least one account.'); const acc=S.setupDraft.accounts[+el.dataset.i]; if(S.tx.some(t=>t.acc===acc.id||t.toAcc===acc.id)) return toast('This account has entries. Rename it instead.'); S.setupDraft.accounts.splice(+el.dataset.i,1); $('#view').innerHTML=viewSetup(); }
  else if(a==='save-setup'){ if(!S.db) return toast('Not saved: saved data is unavailable here.'); el.disabled=true; const d=S.setupDraft;
    const clean={expenseCats:d.expenseCats.filter(c=>c.name.trim()).map(c=>({name:c.name.trim(),items:[...new Set(c.items.map(i=>i.trim()).filter(Boolean))]})),
      incomeCats:d.incomeCats.filter(c=>c.name.trim()).map(c=>({name:c.name.trim(),items:[...new Set(c.items.map(i=>i.trim()).filter(Boolean))]})),
      accounts:d.accounts.filter(a=>a.name.trim()).map(a=>({...a,name:a.name.trim(),opening:+a.opening||0}))};
    try{ await S.db.doc('hh/master').set({...clean,updatedAt:Date.now()}); S.setupDraft=null; toast('Setup saved'); }catch(err){ el.disabled=false; handleWriteErr(err); } }
  else if(a==='export') exportXlsx(el);
});

/* ---------- Data wiring ---------- */
function normMaster(d){
  const cats=x=>Array.isArray(x)&&x.length&&x.every(c=>c&&typeof c.name==='string') ? x.map(c=>({name:c.name, items:Array.isArray(c.items)?c.items.map(String):[]})) : null;
  return { expenseCats:cats(d?.expenseCats)||DEFAULTS.expenseCats, incomeCats:cats(d?.incomeCats)||DEFAULTS.incomeCats,
    accounts:Array.isArray(d?.accounts)&&d.accounts.length ? d.accounts.map(a=>({id:String(a.id),name:String(a.name||''),kind:a.kind||'Bank',owner:a.owner||'Joint',opening:+a.opening||0})) : DEFAULTS.accounts };
}
function normTx(id,d){
  const ym=/^\d{4}-\d{2}$/.test(d.ym)?d.ym:todayYm();
  return {id, type:['income','expense','transfer','saving','return'].includes(d.type)?d.type:'expense', ym, amount:+d.amount||0, cat:String(d.cat||''), item:String(d.item||d.cat||''),
    acc:String(d.acc||''), toAcc:String(d.toAcc||''), goal:String(d.goal||''), grams:+d.grams||0, note:String(d.note||''), by:String(d.by||''), source:String(d.source||'manual'), createdAt:+d.createdAt||0};
}
function normBudget(d){ return {year:+d.year, fileName:String(d.fileName||''), uploadedAt:+d.uploadedAt||0,
  lines:(Array.isArray(d.lines)?d.lines:[]).map(l=>({type:l.type==='income'?'income':'expense', cat:String(l.cat||''), item:String(l.item||l.cat||''), m:Array.from({length:12},(_,i)=>+(l.m?.[i])||0)})).filter(l=>l.cat)}; }
async function resolveNames(){
  if(!S.user) return; const ids=[...new Set(S.tx.map(t=>t.by).concat(S.me?[S.me]:[]).filter(id=>id&&!(id in S.names)))]; if(!ids.length) return;
  try{ const ps=await S.user.profiles(ids); for(const id of ids) S.names[id]=ps?.[id]?.name||''; render(); }catch(_){}
}
async function init(){
  const h=location.hash.slice(1); if(VIEWS.some(v=>v.id===h)) S.view=h;
  render();
  for(let i=0;i<30&&!window.claude?.use;i++) await new Promise(r=>setTimeout(r,100));
  if(!window.claude?.use){ render(); return; }
  const [db,user,downloads]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  S.db=db; S.user=user; S.downloads=downloads;
  if(user){ try{ S.me=await user.id(); }catch(_){} try{ if(await user.can('data.write')===false) S.canWrite=false; }catch(_){} }
  render(); if(!db) return;
  const timer=setTimeout(()=>{ if(!Object.values(S.loaded).every(Boolean)){ S.offline=true; render(); } },10000);
  const done=(k,snap)=>{ if(!snap.metadata.fromCache) S.loaded[k]=true; if(Object.values(S.loaded).every(Boolean)){ clearTimeout(timer); S.offline=false; } };
  const fail=k=>()=>{ S.loaded[k]=true; S.stale=true; render(); };
  db.doc('hh/master').onSnapshot(s=>{ S.masterExists=s.exists; S.master=normMaster(s.exists?s.data():null); done('master',s); render(); }, fail('master'));
  db.collection('tx').onSnapshot(q=>{ S.tx=q.docs.map(d=>normTx(d.id,d.data())); done('tx',q); render(); resolveNames(); }, fail('tx'));
  db.collection('budgets').onSnapshot(q=>{ const b={}; q.docs.forEach(d=>{ if(/^\d{4}$/.test(d.id)) b[d.id]=normBudget(d.data()); }); S.budgets=b; done('budgets',q); render(); }, fail('budgets'));
  db.collection('goals').onSnapshot(q=>{ S.goals=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); done('goals',q); render(); }, fail('goals'));
  resolveNames();
}
function setTheme(t){
  document.documentElement.dataset.theme=t; try{ localStorage.setItem('apbn-theme',t); }catch(_){}
  const dark=t!=='light'; const sw=$('#themeSw'); if(sw){ sw.setAttribute('aria-checked',String(dark)); sw.querySelector('.ts-knob').textContent=dark?'🌙':'☀️'; $('#themeLbl').textContent=dark?'Dark mode':'Light mode'; }
  const mini=$('#themeMini'); if(mini) mini.textContent=dark?'🌙':'☀️';
}
(function(){ let t=null; try{ t=localStorage.getItem('apbn-theme'); }catch(_){} if(!t) t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'; setTheme(t); })();
init();
</script>
